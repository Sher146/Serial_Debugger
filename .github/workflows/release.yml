name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（仅手动触发时需要，例如 1.0.0）"
        required: false
        default: "0.0"
      publish:
        description: "发布到 GitHub Release（关闭时仅生成候选安装包）"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n "$latest" ]]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version

      - name: Determine version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$REQUESTED_VERSION"
          fi
          [[ -z "$v" ]] && v="0.0"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $v"

      - name: Build distribution package
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          DIST_OUTPUT: ${{ github.workspace }}/build/dist
        run: bash Scripts/build_distribution.sh

      - name: Upload candidate packages
        uses: actions/upload-artifact@v4
        with:
          name: SerialMonitor-${{ steps.version.outputs.version }}-packages
          path: |
            build/dist/*.zip
            build/dist/*.dmg
          retention-days: 7
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "本版本更新见 CHANGELOG.md。" > release-notes.md
          fi
          cat release-notes.md

      - name: Publish GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Serial Monitor ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            build/dist/*.zip
            build/dist/*.dmg
