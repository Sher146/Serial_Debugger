name: Regression

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serialcore:
    name: SerialCore (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n "$latest" ]]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          swift --version
      - name: Run SerialCore package tests
        run: swift test --package-path Packages/SerialCore

  app:
    name: App regression (macOS 15 / Xcode 26)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # The app must compile with a macOS 26+ SDK because of the Liquid Glass
      # API. GitHub's macos-14 image cannot host that SDK, so the App job runs
      # on macos-15 with the newest Xcode available on the image.
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n "$latest" ]]; then
            echo "Selecting $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          fi
          xcodebuild -version
          xcode-select -p

      - name: Full automated regression
        run: zsh Scripts/run-automated-tests.zsh --all

      - name: Publish summary
        if: always()
        run: |
          artifact_dir="$(ls -td TestArtifacts/*/ 2>/dev/null | head -1 || true)"
          if [[ -n "$artifact_dir" && -f "${artifact_dir}summary.md" ]]; then
            cat "${artifact_dir}summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestArtifacts
          path: TestArtifacts/
          if-no-files-found: warn
          retention-days: 14
